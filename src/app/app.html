<div class="app-shell">
  <app-title-bar />
  <main class="app-content">
    <app-activity-bar />
    @if (explorer.visible()) {
      <app-sidebar />
    }
    @if (toc.visible()) {
      <app-toc />
    }
    <div class="app-main">
      <router-outlet />
      @if (document.isOpen()) {
        <app-editor-view />
      } @else {
        <div class="welcome">
          <h1>{{ i18n.t('welcome.hello') }}</h1>
          <p>{{ i18n.t('welcome.subtitle') }}</p>
        </div>
      }
    </div>
  </main>

  @if (toast.message(); as message) {
    <div class="toast">{{ message }}</div>
  }
</div>

@if (about.isOpen()) {
  <app-about-dialog />
}
