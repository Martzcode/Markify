<div class="app-shell">
  <app-title-bar />
  <main class="app-content">
    <router-outlet />
    @if (document.isOpen()) {
      <app-editor-view />
    } @else {
      <div class="welcome">
        <h1>{{ i18n.t('welcome.hello') }}</h1>
        <p>{{ i18n.t('welcome.subtitle') }}</p>
      </div>
    }
  </main>

  @if (toast.message(); as message) {
    <div class="toast">{{ message }}</div>
  }
</div>
