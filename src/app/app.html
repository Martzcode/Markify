<div class="app-container">
  <header>
    <div class="header-left">
      <h1>{{ title }}</h1>
      <p class="subtitle">Markdown reader & converter</p>
    </div>
    <button class="btn-open" (click)="openFile()" [disabled]="loading()">
      @if (loading()) {
        Opening…
      } @else {
        &#128193; Open .md file
      }
    </button>
  </header>

  @if (fileName(); as name) {
    <div class="file-info">&#128196; {{ name }}</div>
  }

  <main>
    @if (content(); as html) {
      <div
        class="markdown-body"
        [innerHTML]="html"
        (contextmenu)="onContextMenu($event)"
        (touchstart)="onTouchStart($event)"
        (touchend)="onTouchEnd()"
        (touchmove)="onTouchMove()"
        (touchcancel)="onTouchCancel()"
      ></div>
    } @else {
      <div class="empty-state">
        <p>Open a Markdown file to preview it</p>
      </div>
    }
  </main>

  @if (menuVisible()) {
    <div
      class="context-menu-backdrop"
      (click)="onBackdropClick()"
      (contextmenu)="closeMenu()"
    ></div>
    <div class="context-menu" [style.left.px]="menuX()" [style.top.px]="menuY()">
      <button type="button" (click)="convertToPdf()">Convertir en PDF</button>
    </div>
  }
</div>
