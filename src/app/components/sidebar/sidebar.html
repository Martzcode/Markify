<aside class="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-title" [title]="explorer.rootPath() ?? ''">
      {{ explorer.rootName() }}
    </span>
    <button
      type="button"
      class="sidebar-hide"
      [title]="i18n.t('menu.view.explorer')"
      (click)="explorer.hide()"
    >
      <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
    </button>
  </div>
  @if (explorer.loading()) {
    <div class="sidebar-status">{{ i18n.t('explorer.loading') }}</div>
  } @else if (explorer.error(); as error) {
    <div class="sidebar-status sidebar-error">{{ error }}</div>
  } @else {
    <div class="sidebar-tree">
      @for (entry of explorer.rootEntries(); track entry.path) {
        <app-explorer-node [entry]="entry" [depth]="0" />
      }
    </div>
  }
</aside>
