name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: compute
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            YM="$(date +'%Y.%m')"
            VER=""
            for i in 1 2 3 4 5; do
              LAST="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${YM}." --jq -r '.[].ref' 2>/dev/null || true)"
              LAST="$(printf '%s\n' "$LAST" | sed 's|refs/tags/||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
              if [ -n "$LAST" ]; then
                VER="${YM}.$((${LAST##*.} + 1))"
                break
              fi
              sleep 3
            done
            if [ -z "$VER" ]; then
              VER="${YM}.1"
            fi
          else
            VER="$(jq -r '.version' src-tauri/tauri.conf.json)"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            platform: windows-latest
            bundles: msi,nsis
            args: ''
            targets: ''
            artifact_paths: |
              src-tauri/target/release/bundle/msi/*
              src-tauri/target/release/bundle/nsis/*
          - name: macos
            platform: macos-latest
            bundles: dmg
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact_paths: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*
          - name: debian
            platform: ubuntu-latest
            bundles: deb
            args: ''
            targets: ''
            artifact_paths: |
              src-tauri/target/release/bundle/deb/*
          - name: fedora
            platform: ubuntu-latest
            bundles: rpm
            args: ''
            targets: ''
            artifact_paths: |
              src-tauri/target/release/bundle/rpm/*

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev build-essential libssl-dev patchelf

      - name: Install RPM tooling
        if: matrix.name == 'fedora'
        run: sudo apt-get install -y rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Apply version
        run: node .github/scripts/bump-version.mjs ${{ needs.version.outputs.version }}

      - name: Build bundles
        run: npm run tauri:build -- --bundles ${{ matrix.bundles }} ${{ matrix.args }} --ci

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: markify-${{ matrix.name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [version, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: markify-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          gh release create "${{ needs.version.outputs.version }}" --title "Markify ${{ needs.version.outputs.version }}" --generate-notes $(find . -type f)