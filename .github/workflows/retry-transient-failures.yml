name: Retry transient failures

# GitHub peut annuler un job sans jamais lui attribuer de runner hosted
# (« The job was not acquired by Runner of type hosted… »). Ce workflow
# relance automatiquement la run concernée, dans la limite de trois tentatives.

on:
  workflow_run:
    workflows: ['Build & Release']
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry:
    name: Retry run without a runner
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Rerun when a hosted runner was never assigned
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: run.id,
              per_page: 100,
            });

            // Un job annulé ou en échec sans nom de runner n'a jamais été exécuté :
            // c'est une défaillance d'infrastructure, pas une erreur du projet.
            const stranded = jobs.filter(
              (job) =>
                !job.runner_name &&
                ['cancelled', 'failure', 'timed_out'].includes(job.conclusion),
            );

            if (stranded.length === 0) {
              core.info('No runner-acquisition failure detected; leaving the run unchanged.');
              return;
            }

            const names = stranded.map((job) => job.name).join(', ');
            core.warning(
              `Hosted runner never assigned for: ${names}. ` +
                `Rerunning (attempt ${run.run_attempt} of 3).`,
            );
            await github.rest.actions.rerunWorkflow({ owner, repo, run_id: run.id });
            core.info('Rerun requested.');
